<a class="skip-link" href="#main" (click)="$event.preventDefault(); mainContent.focus()"
  >Skip to content</a
>

<mat-sidenav-container class="shell">
  <mat-sidenav class="shell-nav" mode="over" aria-label="Main navigation">
    <div class="shell-nav-brand">
      <mat-icon aria-hidden="true">rocket_launch</mat-icon>
      <span>{{ appName }}</span>
    </div>
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #rla="routerLinkActive"
          [activated]="rla.isActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
        >
          <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <mat-toolbar class="shell-toolbar" role="banner">
      @if (isHandset()) {
        <button mat-icon-button type="button" aria-label="Open navigation" (click)="toggleNav()">
          <mat-icon aria-hidden="true">menu</mat-icon>
        </button>
      }
      <a class="brand" routerLink="/people" aria-label="Stargate ACTS home">
        <mat-icon aria-hidden="true">rocket_launch</mat-icon>
        <span class="brand-name brand-full">{{ appName }}</span>
        <span class="brand-name brand-short" aria-hidden="true">ACTS</span>
      </a>

      @if (!isHandset()) {
        <nav class="toolbar-nav" aria-label="Main">
          @for (item of navItems; track item.path) {
            <a
              mat-button
              [routerLink]="item.path"
              routerLinkActive="active-link"
              ariaCurrentWhenActive="page"
            >
              {{ item.label }}
            </a>
          }
        </nav>
      }

      <span class="spacer"></span>
      <app-acting-as />
    </mat-toolbar>

    <app-connection-banner />

    <main #mainContent id="main" class="shell-main" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

<div class="visually-hidden" role="status" aria-live="polite" aria-atomic="true">
  {{ announcer.message() }}
</div>
